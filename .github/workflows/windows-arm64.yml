name: Windows ARM64 wheels

on:
  pull_request:
    branches: [master]
  push:
    branches: [ci/windows-arm64-wheels]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Install build tools
        run: python -m pip install 'cmake<4' ninja swig 'numpy>=2,<3' setuptools wheel
      - name: Check build command regression
        run: python -m unittest discover -s test_scripts -p test_build_commands.py -v
      - name: Build wheel
        run: python setup.py bdist_wheel -d dist
      - name: Install and test the wheel in a clean environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv wheel-test
          if ($LASTEXITCODE -ne 0) { throw 'venv creation failed' }
          $python = Join-Path $PWD 'wheel-test/Scripts/python.exe'
          $wheels = @(Get-ChildItem 'dist/nlopt-*-win_arm64.whl')
          if ($wheels.Count -ne 1) { throw 'Expected exactly one ARM64 wheel' }
          & $python -m pip install $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'wheel installation failed' }
          & $python extern/nlopt/test/t_python.py
          if ($LASTEXITCODE -ne 0) { throw 'upstream Python tests failed' }
          & $python test_scripts/native_wheel_smoke.py --require-arm64
          if ($LASTEXITCODE -ne 0) { throw 'native numerical/PE checks failed' }
      # Kept separate from the existing PyPI deployment until maintainers enable it.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
